services:
  postgres:
    image: postgres:16-alpine
    container_name: atrium-postgres
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
      POSTGRES_DB: atrium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: atrium-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: atrium-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/atriumpass
    volumes:
      - neo4j:/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: atrium-api
    network_mode: host
    env_file: .env
    environment:
      DOCUMENTS_DIR: /data/documents
      QDRANT_URL: http://127.0.0.1:6333
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: atriumpass
      DATABASE_URL: postgresql+psycopg://atrium:atrium@127.0.0.1:5432/atrium
      DOCS_ROOT: /repo
      SYNC_DOCS: "true"
    volumes:
      - ./data/documents:/data/documents
      - ./apps/api/app:/app/app
      - ./AGENTS.md:/repo/AGENTS.md
      - ./docs:/repo/docs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    container_name: atrium-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_INTERNAL_URL: http://host.docker.internal:${API_PORT:-8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
    container_name: atrium-admin
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_INTERNAL_URL: http://host.docker.internal:${API_PORT:-8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/admin/app:/app/app
      - ./apps/admin/components:/app/components
      - ./apps/admin/lib:/app/lib
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  qdrant:
  neo4j:
